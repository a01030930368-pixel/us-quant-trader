<style>
/* Layout: a full-screen trading app. Top bar, then a two-column workspace that fills the
   window with no page scroll: KPI strip, chart and ledger on the left; holdings and the
   rebalance calendar on the right. Panels scroll inside themselves.
   Single committed dark look. Korean market convention: red = up / buy, blue = down / sell. */
:root {
  --bg: #0b0c0f;
  --panel: #14161b;
  --panel-2: #1a1d23;
  --line: #24282f;
  --line-soft: #1c1f25;
  --fg: #f2f3f5;
  --sub: #9aa0aa;
  --dim: #636a75;
  --hero: #ffffff;
  --up: #ff4d5e;
  --up-bg: rgba(255, 77, 94, 0.12);
  --down: #3d8bff;
  --down-bg: rgba(61, 139, 255, 0.12);
  --warn: #ffb547;
  --c1: #e9eaee;
  --c2: #ffb547;
  --c3: #8b95ff;
  --c4: #45d0b8;
  --cash: #3a3f48;
  --radius: 14px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  font-feature-settings: "tnum" 1, "ss06" 1;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
}
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--sub); }
.sub { color: var(--sub); }
.dim { color: var(--dim); }

/* App frame */
.app {
  height: 100%;
  min-height: 640px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line-soft);
  min-width: 0;
}
.brand { display: flex; align-items: center; gap: 12px; flex: none; }
.logo { width: 38px; height: 38px; flex: none; display: block; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5)); }
.wordmark { display: grid; gap: 1px; }
.wordmark b { font-size: 20px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.1; }
.wordmark b i { font-style: normal; color: var(--up); }
.wordmark span { font-size: 11.5px; color: var(--dim); font-weight: 500; letter-spacing: 0.01em; }
.divider { width: 1px; height: 30px; background: var(--line); flex: none; }
.title { display: grid; gap: 1px; min-width: 0; }
.title .app-name { font-size: 11.5px; color: var(--dim); font-weight: 500; }
.title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border-radius: 8px;
  background: var(--panel-2); color: var(--sub);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #45d0b8; box-shadow: 0 0 0 3px rgba(69, 208, 184, 0.18); }
.badge.sample { color: var(--warn); background: rgba(255, 181, 71, 0.1); }
.badge.stale { color: var(--up); background: var(--up-bg); }

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(380px, 25vw, 470px);
  gap: 16px;
  padding: 16px 24px 20px;
  min-height: 0;
}
.col { display: grid; gap: 16px; min-height: 0; min-width: 0; }
.col-main { grid-template-rows: auto minmax(0, 1fr) minmax(150px, 32%); }
.col-side { grid-template-rows: fit-content(52%) minmax(0, 1fr); }

.panel {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.panel-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 20px 12px;
}
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
.panel-head .aside { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.panel-body { padding: 0 20px 18px; min-height: 0; flex: 1; }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: 1.5fr repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius);
  padding: 16px 18px; display: grid; gap: 4px; align-content: start; min-width: 0;
}
.kpi .k { font-size: 12.5px; color: var(--sub); font-weight: 500; }
.kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; white-space: nowrap; }
.kpi .s { font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hero {
  background:
    radial-gradient(120% 160% at 100% 0%, rgba(255, 255, 255, 0.06), transparent 55%),
    var(--panel-2);
  border-color: var(--line);
}
.kpi.hero .v { font-size: 30px; color: var(--hero); }
.kpi.hero .v small { font-size: 18px; color: var(--sub); font-weight: 600; }

/* Segmented control */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--bg); }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--sub);
  font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.seg button:hover { color: var(--fg); }
button:focus-visible { outline: 2px solid var(--c3); outline-offset: 2px; }

/* Chart */
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--sub); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 14px; height: 0; border-top: 2px solid; }
.legend .ls i { border-color: var(--c1); }
.legend .lb i { border-color: var(--dim); border-top-style: dashed; }
.legend .ld i { border-top-width: 8px; border-color: var(--down); opacity: 0.45; border-radius: 2px; }
.chart { position: relative; flex: 1; min-height: 0; margin: 0 8px 10px 4px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11.5px; fill: var(--dim); }
.chart .grid line { stroke: var(--line-soft); }
.chart .grid line.zero { stroke: var(--line); }
.tip {
  position: absolute; top: 6px; pointer-events: none; z-index: 2;
  background: rgba(26, 29, 35, 0.96); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 12.5px; min-width: 180px; display: grid; gap: 4px;
  box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.7);
}
.tip .d { color: var(--sub); font-size: 12px; margin-bottom: 2px; }
.tip .row { display: flex; justify-content: space-between; gap: 18px; }
.tip .row span:first-child { color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
.tip .row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th {
  position: sticky; top: 0; z-index: 1; background: var(--panel);
  text-align: right; font-weight: 500; font-size: 12px; color: var(--dim);
  padding: 8px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
}
td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-size: 13.5px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
tbody tr:hover td { background: rgba(255, 255, 255, 0.015); }
.day-row td { color: var(--sub); font-size: 12.5px; font-weight: 600; padding-top: 14px; border-bottom: 0; background: transparent !important; }
.day-row td span { color: var(--dim); font-weight: 500; margin-left: 8px; }
.pill { display: inline-block; min-width: 40px; text-align: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.pill.buy { color: var(--up); background: var(--up-bg); }
.pill.sell { color: var(--down); background: var(--down-bg); }
.st { font-size: 12.5px; color: var(--sub); }
.st.bad { color: var(--up); }
.st.wait { color: var(--warn); }
.empty { padding: 28px 0; text-align: center; color: var(--sub); }

/* Ticker avatar */
.tk { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av {
  width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 10px; font-weight: 800; letter-spacing: -0.03em; color: #fff;
}
.av.long { font-size: 8.5px; letter-spacing: -0.05em; }
.tk .nm { display: grid; min-width: 0; line-height: 1.3; }
.tk .nm b { font-size: 13.5px; font-weight: 700; }
.tk .nm small { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 600; color: var(--sub); background: var(--panel-2); padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }

/* Holdings */
.alloc { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; align-items: center; padding-bottom: 14px; }
.donut { position: relative; width: 132px; height: 132px; }
.donut svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .c b { font-size: 15px; font-weight: 700; }
.donut .c span { font-size: 11.5px; color: var(--sub); }
.alloc-list { display: grid; gap: 7px; font-size: 13px; }
.alloc-list div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.alloc-list i { width: 10px; height: 10px; border-radius: 3px; }
.alloc-list .t { color: var(--dim); font-size: 12px; min-width: 52px; text-align: right; }
.holdings td { padding-top: 10px; padding-bottom: 10px; }
.holdings .pr { display: grid; justify-items: end; line-height: 1.3; }
.holdings .pr small { font-size: 12px; }

/* Rebalance */
.next { display: grid; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
.next-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.next-top .when { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.next-top .when small { font-size: 14px; color: var(--sub); font-weight: 500; margin-left: 4px; }
.dday { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.cycle { display: grid; gap: 6px; }
.cycle .track { position: relative; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.cycle .track span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: linear-gradient(90deg, #5c6370, var(--c1)); }
.cycle .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.step { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.step .k { font-size: 12px; color: var(--sub); }
.step b { font-size: 13.5px; font-weight: 600; }
.signal { padding-top: 14px; display: grid; gap: 14px; }
.signal-head { font-size: 12.5px; color: var(--sub); }
.sleeve { display: grid; gap: 5px; }
.sleeve-name { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--sub); }
.rank { display: grid; grid-template-columns: 54px minmax(0, 1fr) 58px; gap: 10px; align-items: center; font-size: 13px; }
.rank .s { font-weight: 600; color: var(--dim); }
.rank.sel .s { color: var(--fg); }
.rank .track { position: relative; height: 6px; }
.rank .track span { position: absolute; top: 0; height: 100%; border-radius: 3px; }
.rank .track .axis { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.rank .r { text-align: right; font-weight: 600; }
.rank:not(.sel) .r { opacity: 0.6; }
.check { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c1); margin-left: 6px; vertical-align: 2px; }


/* Smaller windows: stack and let the page scroll. */
@media (max-width: 1180px), (max-height: 700px) {
  .app { height: auto; }
  .workspace { grid-template-columns: 1fr; }
  .col-main { grid-template-rows: auto 420px auto; }
  .col-side { grid-template-rows: auto auto; }
  .ledger .scroll { max-height: 420px; }
}
@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi.hero { grid-column: 1 / -1; }
  .workspace { padding: 12px 16px 16px; }
  .topbar { padding: 12px 16px; flex-wrap: wrap; }
  .divider { display: none; }
  .top-right { margin-left: 0; justify-content: flex-start; }
  .hide-sm { display: none; }
  .alloc { grid-template-columns: 1fr; justify-items: center; }
  .alloc-list { width: 100%; }
  .legend { display: none; }
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f38"/><stop offset="1" stop-color="#101216"/></linearGradient>
          <linearGradient id="logo-m" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9aa0aa"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
        </defs>
        <rect x="0.5" y="0.5" width="39" height="39" rx="11" fill="url(#logo-bg)" stroke="#2f343d"/>
        <path d="M10.5 28V13.5l8 8.5 8-8.5V28" fill="none" stroke="url(#logo-m)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="31" cy="9.5" r="3" fill="#ff4d5e"/>
      </svg>
      <div class="wordmark">

    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="title">
      <span class="app-name">운용 전략 · 모의투자</span>
      <h1 id="strategy-name">모의투자 대시보드</h1>
    </div>
    <div class="top-right" id="badges"></div>
  </header>

  <main class="workspace">
    <div class="col col-main">
      <section class="kpis" id="kpis" aria-label="요약"></section>

          <h2 id="perf-title">수익률</h2>

            <span class="ls"><i></i><span id="legend-strat">전략</span></span>

              <button type="button" id="range-all" data-range="all" aria-pressed="true">전체</button>
            </div>
          </div>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <section class="panel ledger" aria-labelledby="trade-title">

            <div class="seg" role="group" aria-label="매매 구분">

              <button type="button" id="side-sell" data-side="sell" aria-pressed="false">매도</button>

        <div class="panel-body scroll"><table id="trades"></table></div>

    <div class="col col-side">
      <section class="panel" aria-labelledby="hold-title">
        <div class="panel-head">
          <h2 id="hold-title">보유 종목</h2>

        </div>
        <div class="panel-body scroll">
          <div class="alloc">
            <div class="donut" id="donut"></div>

          </div>

      <section class="panel" aria-labelledby="reb-title">
        <div class="panel-head">
          <h2 id="reb-title">다음 리밸런싱</h2>
        </div>

      </section>
    </div>
  </main>
</div>

<script id="dashboard-data" type="application/json">/*__DASHBOARD_DATA__*/</script>

  };
  var MODES = { simulate: "연습 모드", kiwoom_mock: "키움 모의투자", kiwoom_live: "실계좌" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function usd(v, dp) {

  function usdSigned(v) { return v == null || isNaN(v) ? "—" : (v > 0 ? "+" : "") + usd(v); }
  function pct(v, dp, plain) {
    if (v == null || isNaN(v)) return "—";
    var s = (Math.abs(v) * 100).toFixed(dp == null ? 2 : dp) + "%";

    var maxV = Math.max(0.01, Math.max.apply(null, sig.scores.map(function (sc) { return sc.return; })));
    var minV = Math.min(0, Math.min.apply(null, sig.scores.map(function (sc) { return sc.return; })));
    var span = maxV - minV, zero = -minV / span * 100;
    // lookbacks가 있으면 여러 기간 수익률의 평균(평균 모멘텀), 없으면 한 기간 수익률
    var months = function (d) { return Math.max(1, Math.round(d / 21)); };
    var basis = sig.lookbacks && sig.lookbacks.length > 1
      ? "평균 모멘텀(" + sig.lookbacks.map(months).join("·") + "개월 수익률 평균)"
      : "최근 " + (sig.lookback_days ? months(sig.lookback_days) + "개월 " : "") + "수익률";
    var h = '<div class="signal"><div class="signal-head">현재 보유 신호 · ' + ymd(sig.as_of) + " 기준 " + basis +
      (strat.safe_asset ? " · 마이너스면 " + esc(strat.safe_asset) : "") + "</div>";
    (strat.sleeves || Object.keys(groups).map(function (k) { return { id: k, name: k }; })).forEach(function (sl) {
      var list = (groups[sl.id] || []).slice().sort(function (a, b) { return b.return - a.return; });
      if (!list.length) return;
      h += '<div class="sleeve"><div class="sleeve-name"><span>' + esc(sl.name) + "</span><span>" + (sl.weight != null ? pct(sl.weight, 0, true) : "") + "</span></div>";
      list.forEach(function (sc) {
        var w = Math.abs(sc.return) / span * 100, left = sc.return >= 0 ? zero : zero - w;
        var col = sc.return >= 0 ? "var(--up)" : "var(--down)";
        h += '<div class="rank' + (sc.selected ? " sel" : "") + '"><span class="s">' + esc(sc.symbol) + (sc.selected ? '<span class="check" title="선택됨"></span>' : "") + "</span>" +
          '<span class="track"><span style="left:' + left.toFixed(1) + "%;width:" + Math.max(1, w).toFixed(1) + "%;background:" + col + ";opacity:" + (sc.selected ? 0.95 : 0.35) + '"></span><span class="axis" style="left:' + zero.toFixed(1) + '%"></span></span>' +
          '<span class="r ' + tone(sc.return) + '">' + pct(sc.return, 1) + "</span></div>";
      });
      h += "</div>";
    });
    reb.push(h + "</div>");
  }
  $("rebalance").innerHTML = reb.join("");

  // ---- ledger ----
  var sideFilter = "all";
  function drawTrades() {
    var list = TRADES.filter(function (t) { return sideFilter === "all" || t.side === sideFilter; });
    $("trade-count").textContent = list.length ? list.length + "건" : "";
    if (!list.length) { $("trades").innerHTML = '<tbody><tr><td class="empty" colspan="7">' + (TRADES.length ? "해당하는 거래가 없어요." : "아직 거래 기록이 없어요.") + "</td></tr></tbody>"; return; }
    var html = '<thead><tr><th>종목</th><th>구분</th><th>수량</th><th class="hide-sm">체결가</th><th>금액</th><th class="hide-sm">수수료</th><th class="hide-sm">상태</th></tr></thead><tbody>';
    var lastDate = null;
    list.forEach(function (t) {
      if (t.date !== lastDate) {
        lastDate = t.date;
        html += '<tr class="day-row"><td colspan="7">' + ymd(t.date) + " (" + wk(t.date) + ")" + (t.note ? "<span>" + esc(t.note) + "</span>" : "") + "</td></tr>";
      }
      var hasPx = t.price != null && +t.price > 0;
      var bad = t.status === "rejected" || t.status === "cancelled", wait = t.status === "pending";
      html += "<tr" + (bad ? ' style="opacity:.55"' : "") + '><td><div class="tk">' + avatar(t.symbol) + '<div class="nm"><b>' + esc(t.symbol) + "</b><small>" + hm(t.time) + " · " + esc(NAMES[t.symbol] || "") + "</small></div></div></td>" +
        '<td><span class="pill ' + esc(t.side) + '">' + (SIDE[t.side] || esc(t.side)) + "</span></td>" +
        "<td>" + (+t.qty).toLocaleString("en-US") + "주</td>" +
        '<td class="hide-sm">' + (hasPx ? usd(+t.price) : "—") + "</td>" +
        "<td><b>" + (hasPx ? usd(t.qty * t.price) : "—") + "</b></td>" +
        '<td class="hide-sm sub">' + usd(+t.fee || 0) + "</td>" +
        '<td class="hide-sm"><span class="st' + (bad ? " bad" : wait ? " wait" : "") + '" title="' + esc(t.message || "") + '">' + (STATUS[t.status] || esc(t.status || "")) + "</span></td></tr>";
    });
    $("trades").innerHTML = html + "</tbody>";
  }
  each("[data-side]", function (btn) {
    btn.addEventListener("click", function () {
      sideFilter = btn.getAttribute("data-side");
      each("[data-side]", function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      drawTrades();
    });
  });
  drawTrades();
})();
</script>
