<title>모의투자 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&display=swap">
<style>
/* Layout: a private-banking statement. Ink ground, brass accent, one wide performance
   panel, then holdings beside the rebalance calendar, then the trade ledger.
   Korean market convention: red = up / buy, blue = down / sell. */
:root {
  --bg: #0b0f17;
  --surface: #111725;
  --surface-2: #172034;
  --line: #222c42;
  --line-soft: #1a2336;
  --fg: #ece8df;
  --muted: #8b92a6;
  --faint: #5d6579;
  --accent: #d4b47a;
  --accent-soft: rgba(212, 180, 122, 0.14);
  --sleeve-b: #4fb3a6;
  --up: #f2636f;
  --up-soft: rgba(242, 99, 111, 0.14);
  --down: #5f9dff;
  --down-soft: rgba(95, 157, 255, 0.14);
  --warn: #e7a94a;
  --bench: #8b92a6;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 20px 40px -24px rgba(0, 0, 0, 0.6);
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f2ee; --surface: #ffffff; --surface-2: #f6f5f1; --line: #e0ddd4; --line-soft: #ebe8e1;
    --fg: #15192a; --muted: #5d6273; --faint: #8d91a0; --accent: #8c6a2c; --accent-soft: rgba(140, 106, 44, 0.10);
    --sleeve-b: #1f7f73; --up: #d3223a; --up-soft: rgba(211, 34, 58, 0.09); --down: #1c5fd1; --down-soft: rgba(28, 95, 209, 0.09);
    --warn: #a86a08; --bench: #7c8193; --shadow: 0 1px 2px rgba(20, 24, 40, 0.04), 0 16px 32px -24px rgba(20, 24, 40, 0.25);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f2ee; --surface: #ffffff; --surface-2: #f6f5f1; --line: #e0ddd4; --line-soft: #ebe8e1;
  --fg: #15192a; --muted: #5d6273; --faint: #8d91a0; --accent: #8c6a2c; --accent-soft: rgba(140, 106, 44, 0.10);
  --sleeve-b: #1f7f73; --up: #d3223a; --up-soft: rgba(211, 34, 58, 0.09); --down: #1c5fd1; --down-soft: rgba(28, 95, 209, 0.09);
  --warn: #a86a08; --bench: #7c8193; --shadow: 0 1px 2px rgba(20, 24, 40, 0.04), 0 16px 32px -24px rgba(20, 24, 40, 0.25);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.9375rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: clamp(16px, 4vw, 40px);
  padding-block: 28px 56px;
  display: grid;
  gap: 20px;
}
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.up { color: var(--up); }
.down { color: var(--down); }
.muted { color: var(--muted); }
.eyebrow {
  font-size: 0.6875rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.125rem; }

/* Masthead */
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.masthead .brand { display: grid; gap: 6px; min-width: 0; }
.masthead h1 { font-size: clamp(1.5rem, 3.2vw, 2rem); }
.masthead .brand p { margin: 0; color: var(--muted); font-size: 0.875rem; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.mode { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.pill.sample { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pill.stale { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, transparent); }

.alerts { display: grid; gap: 8px; }
.alert {
  display: flex; gap: 10px; align-items: baseline;
  padding: 10px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 0.875rem;
}
.alert b { font-weight: 600; font-size: 0.75rem; letter-spacing: 0.08em; }
.alert.info b { color: var(--accent); }
.alert.warn b { color: var(--warn); }
.alert.error b { color: var(--up); }

/* Summary */
.summary {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 2fr);
  gap: 20px;
  align-items: stretch;
}
.hero {
  padding: 22px 24px;
  border-radius: 16px;
  background:
    radial-gradient(120% 140% at 0% 0%, var(--accent-soft), transparent 60%),
    var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: grid;
  gap: 10px;
  align-content: start;
}
.hero .value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.1rem, 5vw, 2.9rem);
  line-height: 1.05;
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -0.02em;
}
.hero .value .cents { font-size: 0.55em; color: var(--muted); font-weight: 500; }
.hero .deltas { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.875rem; }
.hero .deltas span { display: inline-flex; gap: 6px; align-items: baseline; }
.hero .basis { font-size: 0.75rem; color: var(--faint); }

.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  overflow: hidden;
}
.kpi { padding: 20px 20px 18px; display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line-soft); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .v { font-size: 1.5rem; font-weight: 500; line-height: 1.15; }
.kpi .s { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Panels */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
  min-width: 0;
}
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-head .title { display: grid; gap: 2px; }

.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-soft); }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 0.8125rem; padding: 5px 12px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
.seg button:hover { color: var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.8125rem; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend .l-strat i { border-color: var(--accent); }
.legend .l-bench i { border-color: var(--bench); border-top-style: dashed; }
.legend .l-dd i { border-color: var(--down); border-top-width: 6px; opacity: 0.5; }

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font-data); font-size: 11px; fill: var(--faint); }
.chart .grid line { stroke: var(--line-soft); }
.chart .zero { stroke: var(--line); }
.tip {
  position: absolute; top: 0; pointer-events: none;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-size: 0.8125rem; min-width: 168px;
  box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.5);
  display: grid; gap: 3px;
}
.tip .d { color: var(--muted); font-size: 0.75rem; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; }
.tip .row span:first-child { color: var(--muted); }

.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }

/* Allocation */
.alloc { display: flex; height: 12px; gap: 2px; border-radius: 6px; overflow: hidden; margin: 4px 0 10px; }
.alloc span { display: block; height: 100%; min-width: 2px; }
.alloc-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; }
.alloc-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.table-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th {
  text-align: right; font-weight: 500; font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--faint); padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { text-align: right; padding: 11px 6px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
.sym { display: grid; gap: 1px; }
.sym b { font-family: var(--font-data); font-weight: 500; font-size: 0.875rem; }
.sym small { color: var(--muted); font-size: 0.75rem; }
.chip {
  display: inline-block; font-size: 0.6875rem; padding: 1px 7px; border-radius: 5px; margin-left: 6px;
  border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; font-family: var(--font-body);
}
.chip.stable { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chip.aggressive { color: var(--sleeve-b); border-color: color-mix(in srgb, var(--sleeve-b) 40%, transparent); }
.wbar { display: inline-grid; gap: 3px; width: 92px; vertical-align: middle; }
.wbar .t { height: 4px; border-radius: 2px; background: var(--line-soft); position: relative; overflow: hidden; }
.wbar .t span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.wbar .lbl { font-size: 0.6875rem; color: var(--muted); display: flex; justify-content: space-between; }
tfoot td { border-top: 1px solid var(--line); border-bottom: 0; color: var(--muted); padding-top: 12px; }

/* Rebalance */
.cal { display: grid; gap: 18px; }
.cal-date { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cal-date .big { font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; line-height: 1.1; }
.dday {
  font-family: var(--font-data); font-size: 0.875rem; color: var(--accent);
  padding: 4px 10px; border-radius: 8px; background: var(--accent-soft);
}
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; margin-left: 2px;
  border: 2px solid var(--accent); background: var(--surface);
}
.steps li:not(:last-child)::after {
  content: ""; position: absolute; left: 6px; top: 20px; bottom: 2px; width: 1px; background: var(--line);
}
.steps li.done::before { background: var(--accent); }
.steps b { font-weight: 500; }
.steps small { display: block; color: var(--muted); font-size: 0.8125rem; }

.signal { display: grid; gap: 14px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.sleeve-block { display: grid; gap: 6px; }
.sleeve-name { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--muted); }
.bar-row { display: grid; grid-template-columns: 52px 1fr 64px; gap: 10px; align-items: center; font-size: 0.8125rem; }
.bar-row .s { font-family: var(--font-data); }
.bar-row.sel .s { color: var(--fg); font-weight: 500; }
.bar-row:not(.sel) { color: var(--muted); }
.bar-track { position: relative; height: 8px; }
.bar-track .axis { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.bar-track span { position: absolute; top: 0; height: 100%; border-radius: 2px; }
.bar-row .r { text-align: right; }
.sel-mark { color: var(--accent); font-size: 0.6875rem; margin-left: 4px; }

/* Trades */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.group-row td {
  background: var(--surface-2); color: var(--muted); font-size: 0.75rem; padding: 7px 8px; text-align: left;
  border-bottom: 1px solid var(--line-soft);
}
.group-row td b { color: var(--fg); font-weight: 500; font-family: var(--font-data); margin-right: 8px; }
.side { display: inline-block; font-size: 0.75rem; padding: 1px 8px; border-radius: 5px; font-weight: 500; }
.side.buy { color: var(--up); background: var(--up-soft); }
.side.sell { color: var(--down); background: var(--down-soft); }
.more {
  appearance: none; font: inherit; font-size: 0.8125rem; color: var(--accent); cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px;
}
.more:hover { border-color: var(--accent); }
.status { font-size: 0.75rem; color: var(--muted); }
.status.bad { color: var(--up); }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 0.875rem; }

details { margin-top: 12px; font-size: 0.8125rem; }
summary { cursor: pointer; color: var(--muted); }
details .table-wrap { max-height: 320px; overflow: auto; margin-top: 8px; }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; color: var(--faint); font-size: 0.75rem; padding-top: 8px; }
footer code { font-family: var(--font-data); color: var(--muted); }

@media (max-width: 960px) {
  .summary { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
  .panel { padding: 16px; }
  .hero { padding: 18px; }
  .meta { justify-content: flex-start; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .chart path.line-strat { transition: d 0.35s ease; }
}
</style>

<div class="page" id="app">
  <header class="masthead">
    <div class="brand">
      <span class="eyebrow">US Quant · Paper Trading</span>
      <h1 id="strategy-name">모의투자 대시보드</h1>
      <p id="strategy-desc"></p>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="alerts" id="alerts"></div>

  <section class="summary" aria-label="요약">
    <div class="hero">
      <span class="eyebrow">총 평가금액</span>
      <div class="value" id="equity-value">—</div>
      <div class="deltas" id="equity-deltas"></div>
      <div class="basis" id="equity-basis"></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="panel" aria-labelledby="perf-title">
    <div class="panel-head">
      <div class="title">
        <span class="eyebrow">Performance</span>
        <h2 id="perf-title">누적 수익률</h2>
      </div>
      <div class="seg" role="group" aria-label="기간">
        <button type="button" id="range-1m" data-range="21" aria-pressed="false">1개월</button>
        <button type="button" id="range-3m" data-range="63" aria-pressed="false">3개월</button>
        <button type="button" id="range-all" data-range="all" aria-pressed="true">전체</button>
      </div>
    </div>
    <div class="legend">
      <span class="l-strat"><i></i><span id="legend-strat">전략</span></span>
      <span class="l-bench"><i></i><span id="legend-bench">SPY 보유</span></span>
      <span class="l-dd"><i></i>고점 대비 낙폭</span>
    </div>
    <div class="chart" id="chart"></div>
    <details>
      <summary>일별 기록 표로 보기</summary>
      <div class="table-wrap"><table id="daily-table"></table></div>
    </details>
  </section>

  <div class="split">
    <section class="panel" aria-labelledby="hold-title">
      <div class="panel-head">
        <div class="title">
          <span class="eyebrow">Holdings</span>
          <h2 id="hold-title">보유 종목</h2>
        </div>
        <span class="muted num" id="hold-count"></span>
      </div>
      <div class="alloc" id="alloc" role="img"></div>
      <div class="alloc-key" id="alloc-key"></div>
      <div class="table-wrap"><table id="holdings"></table></div>
    </section>

    <section class="panel" aria-labelledby="reb-title">
      <div class="panel-head">
        <div class="title">
          <span class="eyebrow">Next Rebalance</span>
          <h2 id="reb-title">다음 리밸런싱</h2>
        </div>
      </div>
      <div class="cal" id="rebalance"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="trade-title">
    <div class="panel-head">
      <div class="title">
        <span class="eyebrow">Ledger</span>
        <h2 id="trade-title">매매 내역</h2>
      </div>
      <div class="filters">
        <div class="seg" role="group" aria-label="매매 구분">
          <button type="button" id="side-all" data-side="all" aria-pressed="true">전체</button>
          <button type="button" id="side-buy" data-side="buy" aria-pressed="false">매수</button>
          <button type="button" id="side-sell" data-side="sell" aria-pressed="false">매도</button>
        </div>
      </div>
    </div>
    <div class="table-wrap"><table id="trades"></table></div>
  </section>

  <footer>
    <span id="source"></span>
    <span>새 기록을 보려면 <code>dashboard.bat</code>을 다시 실행하세요.</span>
  </footer>
</div>

<script id="dashboard-data" type="application/json">/*__DASHBOARD_DATA__*/</script>

  var raw = document.getElementById("dashboard-data").textContent;

  var META = DATA.meta || {};

  var NAMES = {
    SPY: "S&P 500", QQQ: "나스닥 100", IWM: "러셀 2000 중소형", EFA: "미국 외 선진국", GLD: "금",
    TQQQ: "나스닥 100 3배", UPRO: "S&P 500 3배", TLT: "미국 장기채 20년+", IEF: "미국 중기채 7–10년",

  };

  var SIDE = { buy: "매수", sell: "매도" };
  var STATUS = { filled: "체결", partial: "일부 체결", pending: "대기", rejected: "거부", cancelled: "취소" };

        '<td class="num">' + usd(p.value) + "</td>" +
        '<td class="num ' + tone(pnl) + '">' + pct(pr) + '<br><small>' + (pnl >= 0 ? "+" : "") + usd(pnl) + "</small></td>" +
        '<td class="hide-sm"><span class="wbar"><span class="t"><span style="width:' + Math.min(100, w * 100).toFixed(1) + '%"></span></span>' +
        '<span class="lbl num"><span>' + pct(w, 1, false) + "</span><span>목표 " + (tw == null ? "—" : pct(tw, 0, false)) + "</span></span></span></td></tr>";
    }).join("");
    $("holdings").innerHTML = "<thead><tr><th>종목</th><th>수량 · 평단</th><th class=\"hide-sm\">현재가</th><th>평가금액</th><th>손익</th><th class=\"hide-sm\">비중</th></tr></thead><tbody>" + rows + "</tbody>" +
      '<tfoot><tr><td>합계 (현금 ' + usd(cash) + ' 별도)</td><td></td><td class="hide-sm"></td><td class="num">' + usd(invested) + '</td><td class="num ' + tone(totPnl) + '">' +
      (totCost ? pct(totPnl / totCost) : "—") + '</td><td class="hide-sm"></td></tr></tfoot>';
  }

  // Rebalance
  var reb = [];
  if (nextDate) {
    reb.push('<div class="cal-date"><div><span class="eyebrow">주문일</span><div class="big num-d">' + fmtShort(nextDate) + ' <span class="muted" style="font-size:1rem">(' + WEEK[parseDate(nextDate).getDay()] + ")</span></div></div>" +
      '<span class="dday">' + (dleft > 0 ? "D−" + dleft : dleft === 0 ? "D-Day" : "지난 일정") + "</span></div>");
  } else {
    reb.push('<div class="muted">다음 일정이 아직 기록되지 않았어요.</div>');
  }
  var stepsHtml = '<ol class="steps">';
  if (S.last_rebalance) stepsHtml += '<li class="done"><div><b>지난 리밸런싱</b><small class="num">' + fmtDate(S.last_rebalance, true) + " 체결 완료</small></div></li>";
  if (nextR.signal_date) stepsHtml += "<li><div><b>신호 계산</b><small>" + fmtDate(nextR.signal_date, true) + " 장 마감 후 · 최근 3개월 수익률 순위</small></div></li>";
  if (nextR.order_date) stepsHtml += "<li><div><b>주문 실행</b><small>" + fmtDate(nextR.order_date, true) + " 미국장 개장 직후 · 바뀐 종목만 교체</small></div></li>";
  stepsHtml += "</ol>";
  reb.push(stepsHtml);

  var sig = S.signal;
  if (sig && sig.scores && sig.scores.length) {
    var groups = {};
    sig.scores.forEach(function (sc) { (groups[sc.sleeve] = groups[sc.sleeve] || []).push(sc); });
    var maxAbs = Math.max.apply(null, sig.scores.map(function (sc) { return Math.abs(sc.return); }).concat([0.01]));
    var minV = Math.min(0, Math.min.apply(null, sig.scores.map(function (sc) { return sc.return; })));
    var zeroPct = (-minV) / (maxAbs + -minV) * 100;
    var sh = '<div class="signal"><div><span class="eyebrow">현재 신호</span><div class="muted" style="font-size:.8125rem">' + fmtDate(sig.as_of) + " 기준 최근 " +
      (sig.lookback_days ? Math.round(sig.lookback_days / 21) + "개월" : "") + " 수익률 · 마이너스면 " + esc(strat.safe_asset || "채권") + "으로 대피</div></div>";
    (strat.sleeves || Object.keys(groups).map(function (k) { return { id: k, name: k }; })).forEach(function (sl) {
      var list = (groups[sl.id] || []).slice().sort(function (a, b) { return b.return - a.return; });
      if (!list.length) return;
      sh += '<div class="sleeve-block"><div class="sleeve-name"><span><span class="chip ' + esc(sl.id) + '" style="margin-left:0">' + esc(sl.name) + "</span></span><span class=\"num\">" +
        (sl.weight != null ? pct(sl.weight, 0, false) : "") + "</span></div>";
      list.forEach(function (sc) {
        var w = Math.abs(sc.return) / (maxAbs + -minV) * 100;
        var left = sc.return >= 0 ? zeroPct : zeroPct - w;
        var col = sc.return >= 0 ? (sl.id === "aggressive" ? "var(--sleeve-b)" : "var(--accent)") : "var(--down)";
        sh += '<div class="bar-row' + (sc.selected ? " sel" : "") + '"><span class="s">' + esc(sc.symbol) + (sc.selected ? '<span class="sel-mark" aria-label="선택됨">●</span>' : "") + "</span>" +
          '<span class="bar-track"><span style="left:' + left.toFixed(1) + "%;width:" + Math.max(0.8, w).toFixed(1) + "%;background:" + col + ";opacity:" + (sc.selected ? 1 : 0.45) + '"></span><span class="axis" style="left:' + zeroPct.toFixed(1) + '%"></span></span>' +
          '<span class="r num ' + tone(sc.return) + '">' + pct(sc.return, 1) + "</span></div>";
      });
      sh += "</div>";
    });
    sh += "</div>";
    reb.push(sh);
  }
  $("rebalance").innerHTML = reb.join("");

  // Trades
  var sideFilter = "all", showAllDays = false, DAY_LIMIT = 3;
  function drawTrades() {
    var list = TRADES.filter(function (t) { return sideFilter === "all" || t.side === sideFilter; });
    var days = list.map(function (t) { return t.date; }).filter(function (d, i, a) { return a.indexOf(d) === i; });
    var hiddenDays = showAllDays ? 0 : Math.max(0, days.length - DAY_LIMIT);
    if (hiddenDays) { var keep = days.slice(0, DAY_LIMIT); list = list.filter(function (t) { return keep.indexOf(t.date) >= 0; }); }
    if (!list.length) { $("trades").innerHTML = '<tbody><tr><td class="empty" colspan="7">' + (TRADES.length ? "해당하는 거래가 없어요." : "아직 거래 기록이 없어요.") + "</td></tr></tbody>"; return; }
    var html = "<thead><tr><th>종목</th><th>구분</th><th>수량</th><th class=\"hide-sm\">체결가</th><th>금액</th><th class=\"hide-sm\">수수료</th><th class=\"hide-sm\">상태</th></tr></thead><tbody>";
    var lastDate = null;
    list.forEach(function (t) {
      if (t.date !== lastDate) {
        lastDate = t.date;
        var same = list.filter(function (u) { return u.date === t.date; });
        var buys = same.filter(function (u) { return u.side === "buy"; }).length, sells = same.length - buys;
        html += '<tr class="group-row"><td colspan="7"><b>' + fmtDate(t.date, true) + "</b>" + esc(t.note || "") +
          (t.note ? " · " : "") + (sells ? "매도 " + sells + "건" : "") + (sells && buys ? " · " : "") + (buys ? "매수 " + buys + "건" : "") + "</td></tr>";
      }
      var amt = t.qty * t.price, bad = t.status === "rejected" || t.status === "cancelled";
      html += "<tr" + (bad ? ' style="opacity:.6"' : "") + "><td><div class=\"sym\"><b>" + esc(t.symbol) + "</b><small class=\"num\">" + fmtTime(t.time) + " · " + esc(NAMES[t.symbol] || "") + "</small></div></td>" +
        '<td><span class="side ' + esc(t.side) + '">' + (SIDE[t.side] || esc(t.side)) + "</span></td>" +
        '<td class="num">' + (+t.qty).toLocaleString("en-US") + "</td>" +
        '<td class="num hide-sm">' + usd(+t.price) + "</td>" +
        '<td class="num">' + usd(amt) + "</td>" +
        '<td class="num hide-sm muted">' + usd(+t.fee || 0) + "</td>" +
        '<td class="hide-sm"><span class="status' + (bad ? " bad" : "") + '" title="' + esc(t.message || "") + '">' + (STATUS[t.status] || esc(t.status || "")) + "</span></td></tr>";
    });
    if (hiddenDays) html += '<tr><td colspan="7" style="text-align:center;padding-top:14px"><button type="button" class="more" id="trades-more">이전 매매 ' + hiddenDays + "일 더 보기</button></td></tr>";
    $("trades").innerHTML = html + "</tbody>";
    var more = $("trades-more");
    if (more) more.addEventListener("click", function () { showAllDays = true; drawTrades(); });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-side]"), function (btn) {
    btn.addEventListener("click", function () {
      sideFilter = btn.getAttribute("data-side");
      Array.prototype.forEach.call(document.querySelectorAll("[data-side]"), function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      drawTrades();
    });
  });
  drawTrades();

  $("source").innerHTML = "데이터: <code>" + esc(META.dir || "paper/") + "</code>" + (META.generated_at ? " · 화면 생성 " + esc(META.generated_at) : "");
})();
</script>
