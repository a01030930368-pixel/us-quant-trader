<title>Mintory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2316181d'/%3E%3Cpath d='M10.5 28V13.5l8 8.5 8-8.5V28' fill='none' stroke='%23f2f3f5' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='31' cy='9.5' r='3' fill='%23ff4d5e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* Layout: a full-screen trading app. Top bar, then a two-column workspace that fills the
   window with no page scroll: KPI strip, chart and ledger on the left; holdings and the
   rebalance calendar on the right. Panels scroll inside themselves.
   Single committed dark look. Korean market convention: red = up / buy, blue = down / sell. */
:root {
  --bg: #0b0c0f;
  --panel: #14161b;
  --panel-2: #1a1d23;
  --line: #24282f;
  --line-soft: #1c1f25;
  --fg: #f2f3f5;
  --sub: #9aa0aa;
  --dim: #636a75;
  --hero: #ffffff;
  --up: #ff4d5e;
  --up-bg: rgba(255, 77, 94, 0.12);
  --down: #3d8bff;
  --down-bg: rgba(61, 139, 255, 0.12);
  --warn: #ffb547;
  --c1: #e9eaee;
  --c2: #ffb547;
  --c3: #8b95ff;
  --c4: #45d0b8;
  --cash: #3a3f48;
  --radius: 14px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  font-feature-settings: "tnum" 1, "ss06" 1;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
}
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--sub); }
.sub { color: var(--sub); }
.dim { color: var(--dim); }

/* App frame */
.app {
  height: 100%;
  min-height: 640px;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
}
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line-soft);
  min-width: 0;
}
.brand { display: flex; align-items: center; gap: 12px; flex: none; }
.logo { width: 38px; height: 38px; flex: none; display: block; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5)); }
.wordmark { display: grid; gap: 1px; }
.wordmark b { font-size: 20px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.1; }
.wordmark b i { font-style: normal; color: var(--up); }
.wordmark span { font-size: 11.5px; color: var(--dim); font-weight: 500; letter-spacing: 0.01em; }
.divider { width: 1px; height: 30px; background: var(--line); flex: none; }
.title { display: grid; gap: 1px; min-width: 0; }
.title .app-name { font-size: 11.5px; color: var(--dim); font-weight: 500; }
.title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border-radius: 8px;
  background: var(--panel-2); color: var(--sub);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #45d0b8; box-shadow: 0 0 0 3px rgba(69, 208, 184, 0.18); }
.badge.sample { color: var(--warn); background: rgba(255, 181, 71, 0.1); }
.badge.stale { color: var(--up); background: var(--up-bg); }
.sample-bar { margin: 12px 24px 0; padding: 10px 14px; border-radius: 10px; background: rgba(255, 181, 71, 0.1); color: var(--warn); font-size: 13px; }
.sample-bar b { color: var(--fg); }
/* 로고 옆 시장 지수 (S&P 500 · 나스닥 · VIX) */
.indices { display: flex; align-items: center; gap: 22px; flex: none; }  /* 줄어들면 내용이 시계 위로 넘침 */
.ix { display: grid; gap: 1px; }
.ix .n { font-size: 11.5px; color: var(--dim); font-weight: 500; white-space: nowrap; }
.ix .v { display: flex; align-items: baseline; gap: 7px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.ix .c { font-size: 12.5px; font-weight: 600; }
.ix svg { width: 54px; height: 18px; align-self: center; }
@media (max-width: 1700px) { .ix svg { display: none; } .indices { gap: 16px; } }
/* 미국장 시계 */
.mclock { display: grid; gap: 1px; padding-left: 22px; border-left: 1px solid var(--line); flex: none; }
.mclock .n { font-size: 11.5px; color: var(--dim); font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.mclock .n i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.mclock.open .n i { background: var(--up); box-shadow: 0 0 0 3px var(--up-bg); }
.mclock.ext .n i { background: var(--warn); }
.mclock .v { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; display: flex; align-items: baseline; gap: 8px; }
.mclock .v small { font-size: 12px; color: var(--sub); font-weight: 500; }
.mclock .bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 3px; }
.mclock .bar span { display: block; height: 100%; background: var(--up); }
@media (max-width: 1500px) { .mclock .v small { display: none; } }
@media (max-width: 1280px) { .mclock { display: none; } }
/* 앱 상태 불: 초록 정상, 노랑 일시정지, 빨강 확인 필요 */
.led-wrap { position: relative; flex: none; }
.led { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; padding: 0; }
.led i { width: 9px; height: 9px; border-radius: 50%; background: #45d0b8; box-shadow: 0 0 0 4px rgba(69, 208, 184, 0.18), 0 0 10px rgba(69, 208, 184, 0.55); }
.led.paused i { background: var(--warn); box-shadow: 0 0 0 4px rgba(255, 181, 71, 0.18), 0 0 10px rgba(255, 181, 71, 0.5); }
.led.bad i { background: var(--up); box-shadow: 0 0 0 4px var(--up-bg), 0 0 10px rgba(255, 77, 94, 0.6); animation: led-blink 1.6s ease-in-out infinite; }
@keyframes led-blink { 50% { opacity: 0.45; } }
.led-pop { position: absolute; top: 42px; right: 0; z-index: 40; min-width: 270px; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 12.5px; color: var(--sub); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55); }
.led-pop b { color: var(--text); font-size: 13.5px; font-weight: 600; }
.led-pop .issue { color: var(--up); }
.led-pop .warn { color: var(--warn); }

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(380px, 25vw, 470px);
  gap: 16px;
  padding: 16px 24px 20px;
  min-height: 0;
}
.col { display: grid; gap: 16px; min-height: 0; min-width: 0; }
.col-main { grid-template-rows: auto minmax(0, 1fr) minmax(150px, 32%); }
.col-side { grid-template-rows: fit-content(52%) minmax(0, 1fr); }

.panel {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.panel-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 20px 12px;
}
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
.panel-head .aside { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.panel-body { padding: 0 20px 18px; min-height: 0; flex: 1; }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: 1.5fr repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius);
  padding: 16px 18px; display: grid; gap: 4px; align-content: start; min-width: 0;
}
.kpi .k { font-size: 12.5px; color: var(--sub); font-weight: 500; }
.kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; white-space: nowrap; }
.kpi .s { font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hero {
  background:
    radial-gradient(120% 160% at 100% 0%, rgba(255, 255, 255, 0.06), transparent 55%),
    var(--panel-2);
  border-color: var(--line);
}
.kpi.hero .v { font-size: 30px; color: var(--hero); }
.kpi.hero .v small { font-size: 18px; color: var(--sub); font-weight: 600; }
.kpi .s.krw { color: var(--dim); }
.kpi { position: relative; }
.kpi .k .tax-chip { position: absolute; top: 12px; right: 12px; height: 22px; padding: 0 8px; font-size: 11.5px; }
@media (max-width: 1500px) { .kpi .s.krw .fxr { display: none; } }
.tax-grid { display: grid; gap: 6px; margin: 0 6px; }
.tax-row { display: flex; justify-content: space-between; gap: 12px; background: var(--panel); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tax-row span { color: var(--sub); }
.tax-row b { font-weight: 650; }
.tax-row b .up { color: var(--up); }
.tax-row b .down { color: var(--down); }
.tax-row b small { color: var(--sub); font-weight: 500; }
.tax-row.big { padding: 13px 14px; }
.tax-row.big b { font-size: 17px; }
.tax-sec { margin: 14px 6px 6px; font-size: 12.5px; color: var(--sub); font-weight: 600; }

/* Segmented control */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--bg); }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--sub);
  font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.seg button:hover { color: var(--fg); }
button:focus-visible { outline: 2px solid var(--c3); outline-offset: 2px; }

/* Chart */
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--sub); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 14px; height: 0; border-top: 2px solid; }
.legend .ls i { border-color: var(--c1); }
.legend .lb i { border-color: var(--dim); border-top-style: dashed; }
.legend .lm i { border-color: var(--c3); border-top-style: dotted; }
.legend .ld i { border-top-width: 8px; border-color: var(--down); opacity: 0.45; border-radius: 2px; }
.chart { position: relative; flex: 1; min-height: 0; margin: 0 8px 10px 4px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11.5px; fill: var(--dim); }
.chart .grid line { stroke: var(--line-soft); }
.chart .grid line.zero { stroke: var(--line); }
.tip {
  position: absolute; top: 6px; pointer-events: none; z-index: 2;
  background: rgba(26, 29, 35, 0.96); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 12.5px; min-width: 180px; display: grid; gap: 4px;
  box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.7);
}
.tip .d { color: var(--sub); font-size: 12px; margin-bottom: 2px; }
.tip .row { display: flex; justify-content: space-between; gap: 18px; }
.tip .row span:first-child { color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
.tip .row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th {
  position: sticky; top: 0; z-index: 1; background: var(--panel);
  text-align: right; font-weight: 500; font-size: 12px; color: var(--dim);
  padding: 8px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
}
td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-size: 13.5px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
tbody tr:hover td { background: rgba(255, 255, 255, 0.015); }
.day-row td { color: var(--sub); font-size: 12.5px; font-weight: 600; padding-top: 14px; border-bottom: 0; background: transparent !important; }
.day-row td span { color: var(--dim); font-weight: 500; margin-left: 8px; }
.pill { display: inline-block; min-width: 40px; text-align: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.pill.buy { color: var(--up); background: var(--up-bg); }
.pill.sell { color: var(--down); background: var(--down-bg); }
.st { font-size: 12.5px; color: var(--sub); }
.st.bad { color: var(--up); }
.st.wait { color: var(--warn); }
.empty { padding: 28px 0; text-align: center; color: var(--sub); }

/* Ticker avatar */
.tk { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av {
  width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 10px; font-weight: 800; letter-spacing: -0.03em; color: #fff;
}
.av.long { font-size: 8.5px; letter-spacing: -0.05em; }
.tk .nm { display: grid; min-width: 0; line-height: 1.3; }
.tk .nm b { font-size: 13.5px; font-weight: 700; }
.tk .nm small { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 600; color: var(--sub); background: var(--panel-2); padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }

/* Holdings */
.alloc { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; align-items: center; padding-bottom: 14px; }
.donut { position: relative; width: 132px; height: 132px; }
.donut svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .c b { font-size: 15px; font-weight: 700; }
.donut .c span { font-size: 11.5px; color: var(--sub); }
.alloc-list { display: grid; gap: 7px; font-size: 13px; }
.alloc-list div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.alloc-list i { width: 10px; height: 10px; border-radius: 3px; }
.alloc-list .t { color: var(--dim); font-size: 12px; min-width: 52px; text-align: right; }
.holdings td { padding-top: 10px; padding-bottom: 10px; }
.holdings .pr { display: grid; justify-items: end; line-height: 1.3; }
.holdings .pr small { font-size: 12px; }

/* Rebalance */
.next { display: grid; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
.next-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.next-top .when { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.next-top .when small { font-size: 14px; color: var(--sub); font-weight: 500; margin-left: 4px; }
.dday { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.cycle { display: grid; gap: 6px; }
.cycle .track { position: relative; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.cycle .track span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: linear-gradient(90deg, #5c6370, var(--c1)); }
.cycle .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.step { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.step .k { font-size: 12px; color: var(--sub); }
.step b { font-size: 13.5px; font-weight: 600; }
.pv { margin-top: 10px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.pv-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
.pv-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; padding: 3px 0; }
.pv-row .side { font-weight: 600; margin-right: 6px; }
.pv-row .buy { color: var(--up); }
.pv-row .sell { color: var(--down); }
.pv-row small { color: var(--sub); }
.pv-none { font-size: 13px; color: var(--sub); }
/* 카나리아 신호와 분할(덩어리) 상태 */
.canary { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--panel-2); }
.canary i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #45d0b8; }
.canary.off i { background: var(--warn); }
.canary small { color: var(--sub); margin-left: auto; white-space: nowrap; }
.parts { display: grid; gap: 6px; }
.parts-head { font-size: 12.5px; color: var(--sub); }
.part { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 12.5px; }
.part b { font-weight: 600; white-space: nowrap; }
.part b.cur { color: var(--fg); }
.part span { color: var(--sub); }
.part em { font-style: normal; color: var(--warn); }
.signal { padding-top: 14px; display: grid; gap: 14px; }
.signal-head { font-size: 12.5px; color: var(--sub); }
.sleeve { display: grid; gap: 5px; }
.sleeve-name { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--sub); }
.rank { display: grid; grid-template-columns: 54px minmax(0, 1fr) 58px; gap: 10px; align-items: center; font-size: 13px; }
.rank .s { font-weight: 600; color: var(--dim); }
.rank.sel .s { color: var(--fg); }
.rank .track { position: relative; height: 6px; }
.rank .track span { position: absolute; top: 0; height: 100%; border-radius: 3px; }
.rank .track .axis { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.rank .r { text-align: right; font-weight: 600; }
.rank:not(.sel) .r { opacity: 0.6; }
.check { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c1); margin-left: 6px; vertical-align: 2px; }

/* In-app controls (only when the page is served by the Mintory agent) */
.controls { display: flex; align-items: center; gap: 6px; flex: none; }
.ctl {
  appearance: none; display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background .15s, border-color .15s, opacity .15s;
}
.ctl:hover:not(:disabled) { background: #222630; border-color: #353a44; }
.ctl:disabled { opacity: 0.45; cursor: default; }
.ctl.primary { background: var(--fg); color: #0b0c0f; border-color: var(--fg); }
.ctl.primary:hover:not(:disabled) { background: #ffffff; border-color: #ffffff; }
.ctl.on { color: var(--up); background: var(--up-bg); border-color: rgba(255, 77, 94, 0.35); }
.ctl svg { width: 14px; height: 14px; flex: none; }
.ctl.busy svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge.paused { color: #fff; background: var(--up); font-weight: 600; }
.modal-back {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
  background: rgba(5, 6, 8, 0.66); backdrop-filter: blur(3px);
}
.modal {
  width: min(440px, 100%); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px 22px 18px; display: grid; gap: 14px;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
}
.modal h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.modal p { margin: 0; color: var(--sub); font-size: 13.5px; line-height: 1.6; }
.modal .mkt { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--panel); font-size: 13px; }
.modal .mkt i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.modal .ctl { height: 36px; padding: 0 16px; font-size: 13.5px; }
.ctl.mini { height: 26px; padding: 0 9px; font-size: 12px; gap: 5px; color: var(--sub); }
.ctl.mini:hover { color: var(--fg); }

.modal.wide { width: min(1180px, 100%); max-height: calc(100vh - 32px); padding: 20px 22px 18px; grid-template-rows: auto minmax(0, 1fr) auto; }
.modal .m-head { display: flex; align-items: baseline; gap: 12px; }
.modal .m-head .sub { font-size: 13px; }

.detail { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.detail th, .detail td { padding: 11px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line-soft); }
.detail th:first-child, .detail td:first-child { text-align: left; }
.detail thead th { position: sticky; top: 0; background: var(--panel-2); color: var(--sub); font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; }
.detail thead th:hover { color: var(--fg); }

.detail thead th.on.asc::after { content: " ↑"; }

.detail tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--line); }
.detail .bar { display: inline-block; width: 56px; height: 4px; border-radius: 2px; background: var(--panel); vertical-align: middle; margin-left: 8px; position: relative; overflow: hidden; }
.detail .bar i { position: absolute; inset: 0 auto 0 0; background: var(--fg); opacity: 0.75; }
.modal .m-foot { color: var(--dim); font-size: 12px; }

.m-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0 6px 12px; }
.m-stats div { background: var(--panel); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; }
.m-stats span { color: var(--sub); font-size: 12px; }
.m-stats b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

.ready-sum { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 6px 12px; }
.ready-sum span { background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--sub); }
.ready-sum span b { color: var(--fg); margin-left: 4px; }
.ready-list { display: grid; gap: 6px; margin: 0 6px; }
.ready-row { display: grid; grid-template-columns: 26px 220px 1fr; gap: 10px; align-items: center; background: var(--panel); border-radius: 10px; padding: 11px 14px; font-size: 13px; }
.ready-row .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.ready-row.ok .ic { background: rgba(69, 208, 184, 0.16); color: #45d0b8; }
.ready-row.warn .ic { background: rgba(255, 181, 71, 0.16); color: var(--warn); }
.ready-row.fail .ic { background: var(--up-bg); color: var(--up); }
.ready-row.todo .ic { background: var(--line); color: var(--sub); }
.ready-row b { font-weight: 650; }
.ready-row span { color: var(--sub); }
@media (max-width: 760px) { .ready-row { grid-template-columns: 26px 1fr; } .ready-row span { grid-column: 2; } }
.detail tr.bad td { opacity: 0.55; }
.m-chart { margin: 0 6px 14px; background: var(--panel); border-radius: 12px; padding: 12px 14px 6px; }

<script id="dashboard-data" type="application/json">/*__DASHBOARD_DATA__*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  var S = DATA.state || {};
  var META = DATA.meta || {};
  // 날짜는 최신순, 같은 날 안에서는 체결 순서대로

  var EQ = (DATA.equity || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });

  var NAMES = {
    SPY: "S&P 500", QQQ: "나스닥 100", IWM: "러셀 2000", EFA: "미국 외 선진국", GLD: "금",

  };
  var AVATAR = {
    SPY: "#2f5bd3", QQQ: "#6a4bd8", IWM: "#1f8a70", EFA: "#b5652a", GLD: "#b8902a",
    TQQQ: "#a33e8f", UPRO: "#2b7fa8", TLT: "#59606c", IEF: "#46505e"
  };
  var MODES = { simulate: "연습 모드", kiwoom_mock: "키움 모의투자", kiwoom_live: "실계좌" };
  var SIDE = { buy: "매수", sell: "매도" };
  var STATUS = { filled: "체결", partial: "일부 체결", pending: "체결 확인 중", rejected: "거부", cancelled: "취소" };
  var WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  var SLICE = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
  // Live quotes from the agent (only when served at 127.0.0.1). Empty until the first fetch.
  var LIVE = { on: false, fresh: false, quotes: {}, label: "", title: "" };

  function $(id) { return document.getElementById(id); }
  // 새로 읽기 전에 열어 둔 창(자세히, 점검표, 확인 창, 상태 불)이 있으면 닫힐 때까지 기다린다.
  function reloadWhenIdle() {
    if (document.querySelector(".modal-back, .led-pop")) { setTimeout(reloadWhenIdle, 5000); return; }
    location.reload();
  }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function usd(v, dp) {
    if (v == null || isNaN(v)) return "—";
    dp = dp == null ? 2 : dp;
    return (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function usdSigned(v) { return v == null || isNaN(v) ? "—" : (v > 0 ? "+" : "") + usd(v); }
  function won(v) { return v == null || isNaN(v) ? "—" : (v < 0 ? "-₩" : "₩") + Math.round(Math.abs(v)).toLocaleString("ko-KR"); }
  function wonSigned(v) { return v == null || isNaN(v) ? "—" : (v > 0 ? "+" : "") + won(v); }
  // 원/달러 환율: 실행기가 밤마다 기록한 값, 자동 실행기가 켜져 있으면 실시간 시세로 덮어씀
  var TAX = DATA.tax || null;
  var FX = { rate: (S.fx && +S.fx.usdkrw) || (TAX && +TAX.usdkrw) || null, live: false, as_of: S.fx && S.fx.as_of };
  function pct(v, dp, plain) {
    if (v == null || isNaN(v)) return "—";
    var s = (Math.abs(v) * 100).toFixed(dp == null ? 2 : dp) + "%";
    return v < 0 ? "-" + s : (plain ? "" : "+") + s;
  }
  function tone(v) { return v > 0 ? "up" : v < 0 ? "down" : "flat"; }
  function parseDate(s) { var p = String(s).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(s) { var d = parseDate(s); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
  function ymd(s) { var d = parseDate(s); return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0"); }
  function wk(s) { return WEEK[parseDate(s).getDay()]; }
  function hm(iso) { var m = /T(\d{2}):(\d{2})/.exec(iso || ""); return m ? m[1] + ":" + m[2] : ""; }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function days(a, b) { return Math.round((b - a) / 86400000); }
  function avatar(sym) {
    var bg = AVATAR[sym] || "#4a505b";
    return '<span class="av' + (sym.length > 3 ? " long" : "") + '" style="background:' + bg + '">' + esc(sym.slice(0, 4)) + "</span>";
  }

  // ---- numbers ----
  var strat = S.strategy || {};
  var bench = S.benchmark || "SPY";
  var initial = +S.initial_capital || (EQ.length ? +EQ[0].equity : 0);
  var cash = +S.cash || 0;
  var positions = (S.positions || []).map(function (p) {
    var px = p.last_price != null ? +p.last_price : +p.avg_price;
    return Object.assign({}, p, { px: px, value: p.qty * px, cost: p.qty * p.avg_price });
  }).sort(function (a, b) { return b.value - a.value; });
  var invested = positions.reduce(function (a, p) { return a + p.value; }, 0);

  // 같은 전략을 같은 날, 같은 금액으로 백테스트한 평가금액 (실행기가 state.backtest에 남김)

  // ---- KPI strip ----
  function renderKpis() {

  // ---- chart ----
  var range = "all";
  function niceStep(span, n) {
    var raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  }
  function drawChart() {
    var box = $("chart");
    if (!series.length) { box.innerHTML = '<div class="empty">아직 일별 기록이 없어요. 실행기가 하루 이상 돌면 그래프가 나타납니다.</div>'; return; }
    var pts = range === "all" ? series : series.slice(-Math.max(2, +range + 1));
    var b0 = pts[0], base = 1 + b0.ret, bbase = b0.bench == null ? null : 1 + b0.bench;
    var m0 = pts.filter(function (p) { return p.model != null; })[0], mbase = m0 ? 1 + m0.model : null;
    var data = pts.map(function (p) {
      return {
        date: p.date, equity: p.equity, dd: p.dd, live: p.live,
        r: range === "all" ? p.ret : (1 + p.ret) / base - 1,
        b: p.bench == null ? null : range === "all" ? p.bench : (1 + p.bench) / bbase - 1,
        m: p.model == null ? null : range === "all" ? p.model : (1 + p.model) / mbase * (1 + m0.ret) / base - 1
      };
    });
    if (range === "all") data.unshift({ date: null, equity: initial, dd: 0, r: 0, b: 0, origin: true });
    var W = Math.max(280, box.clientWidth), H = Math.max(150, box.clientHeight);
    var padL = 50, padR = 58, top = 8, axisH = 24;
    var ddH = Math.round(Math.min(110, Math.max(36, H * 0.2))), gapH = H < 260 ? 14 : 22;
    var mainH = H - top - axisH - ddH - gapH;
    var vals = [];
    data.forEach(function (d) { vals.push(d.r); if (d.b != null) vals.push(d.b); if (d.m != null) vals.push(d.m); });
    var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
    if (hi - lo < 0.01) { hi += 0.005; lo -= 0.005; }
    var step = niceStep(hi - lo, Math.max(3, Math.min(6, Math.round(mainH / 55))));
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    var ddLo = Math.min(-0.01, Math.min.apply(null, data.map(function (d) { return d.dd; })));
    var ddStep = niceStep(-ddLo, 2); ddLo = Math.floor(ddLo / ddStep) * ddStep;
    var n = data.length;
    function x(i) { return padL + (n === 1 ? 0 : i / (n - 1)) * (W - padL - padR); }
    function y(v) { return top + (hi - v) / (hi - lo) * mainH; }
    var ddTop = top + mainH + gapH;
    function yd(v) { return ddTop + (v / ddLo) * ddH; }
    function path(acc) {
      var d = "", on = false;
      data.forEach(function (p, i) {
        var v = acc(p); if (v == null) { on = false; return; }
        d += (on ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); on = true;
      });
      return d;
    }
    var s = [];
    s.push('<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="전략과 ' + esc(bench) + ' 누적 수익률 비교">');
    s.push('<defs><linearGradient id="g-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>');
    s.push('<g class="grid">');
    for (var v = lo; v <= hi + 1e-9; v += step) {
      var yy = y(v).toFixed(1), z = Math.abs(v) < 1e-9;
      s.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"' + (z ? ' class="zero"' : "") + "/>");
      s.push('<text x="' + (padL - 10) + '" y="' + yy + '" dy="0.32em" text-anchor="end">' + (z ? "0%" : pct(v, step < 0.01 ? 1 : 0)) + "</text>");
    }
    for (var dv = 0; dv >= ddLo - 1e-9; dv -= ddStep) {
      var y2 = yd(dv).toFixed(1);
      s.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y2 + '" y2="' + y2 + '"/>');
      s.push('<text x="' + (padL - 10) + '" y="' + y2 + '" dy="0.32em" text-anchor="end">' + (Math.abs(dv) < 1e-9 ? "0%" : pct(dv, ddStep < 0.01 ? 1 : 0)) + "</text>");
    }
    s.push("</g>");
    // x axis: month starts, or evenly spaced days for short ranges
    var ticks = [], lastM = null;
    data.forEach(function (p, i) { if (!p.date) return; var m = p.date.slice(0, 7); if (m !== lastM) { ticks.push(i); lastM = m; } });
    var monthly = range === "all" || ticks.length >= 3;
    if (!monthly) { ticks = []; var every = Math.max(1, Math.round(n / 5)); for (var t = 0; t < n; t += every) if (data[t].date) ticks.push(t); }
    var lastX = -Infinity;
    ticks.forEach(function (i) {
      var xx = x(i);
      if (xx - lastX < 56 || xx > W - padR - 10) return;
      lastX = xx;
      var d = parseDate(data[i].date);
      s.push('<text x="' + xx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + (monthly ? (d.getMonth() + 1) + "월" : (d.getMonth() + 1) + "/" + d.getDate()) + "</text>");
    });
    var line = path(function (p) { return p.r; });
    var y0 = y(Math.max(lo, Math.min(hi, 0))).toFixed(1);
    s.push('<path d="' + line + "L" + x(n - 1).toFixed(1) + " " + y0 + "L" + x(0).toFixed(1) + " " + y0 + 'Z" fill="url(#g-s)"/>');
    s.push('<path d="' + path(function (p) { return p.b; }) + '" fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>');
    s.push('<path d="' + path(function (p) { return p.m; }) + '" fill="none" stroke="var(--c3)" stroke-width="1.6" stroke-dasharray="1.5 3" stroke-linecap="round" stroke-linejoin="round"/>');
    s.push('<path d="' + line + '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    var dd = "M" + x(0).toFixed(1) + " " + yd(0).toFixed(1);
    data.forEach(function (p, i) { dd += "L" + x(i).toFixed(1) + " " + yd(p.dd).toFixed(1); });
    dd += "L" + x(n - 1).toFixed(1) + " " + yd(0).toFixed(1) + "Z";
    s.push('<path d="' + dd + '" fill="var(--down)" fill-opacity="0.22" stroke="var(--down)" stroke-opacity="0.75" stroke-width="1"/>');
    // end labels
    var L = data[n - 1], ex = x(n - 1);
    var ys = y(L.r), yb = L.b == null ? null : y(L.b);

      var close = function () { back.remove(); document.removeEventListener("keydown", onKey); };
      var onKey = function (e) { if (e.key === "Escape") close(); };
      document.addEventListener("keydown", onKey);
      back.addEventListener("click", function (e) {
        var act = e.target.closest && e.target.closest("[data-act]");
        if (e.target === back || (act && act.getAttribute("data-act") === "no")) close();
        else if (act) { close(); start("/api/run"); }
      });
      back.querySelector('[data-act="no"]').focus();
    };

    // ---- 실계좌 점검표 (읽기만 함) ----
    var btnCheck = $("btn-check");
    var readyIcon = { ok: "✓", warn: "!", fail: "✕", todo: "·" };
    var openReadiness = function () {
      var back = document.createElement("div");
      back.className = "modal-back";
      back.innerHTML = '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="r-title" style="width:min(900px,100%)">' +
        '<div class="m-head"><h3 id="r-title">실계좌 전환 점검표</h3><span class="sub">불러오는 중…</span>' +
        '<button type="button" class="ctl mini" data-act="keys" title="실계좌 앱키로 토큰을 받고 달러 예수금만 조회해요. 주문은 내지 않아요.">실계좌 키 확인 (조회만)</button>' +
        '<button type="button" class="ctl mini" data-act="rehearse" title="실계좌 잔고를 읽어 오늘 전략이 실계좌에서 낼 주문을 계산해요. 주문은 내지 않아요.">리허설 해보기</button>' +
        '<button type="button" class="ctl x" data-act="close">닫기</button></div>' +
        '<div class="m-body"></div>' +
        '<div class="m-foot">점검만 해요. 실행기는 계속 모의투자로 돌고, 실계좌 전환은 모든 항목을 확인한 뒤 따로 진행해요.</div></div>';
      document.body.appendChild(back);
      var sub = back.querySelector(".sub"), body = back.querySelector(".m-body"), keyBtn = back.querySelector('[data-act="keys"]'),
          rehBtn = back.querySelector('[data-act="rehearse"]');
      var draw = function (r) {
        var sm = r.summary || {};
        sub.textContent = sm.ready ? "모두 준비됐어요" : (sm.total || 0) + "개 중 " + (sm.ok || 0) + "개 준비됨";
        body.innerHTML = '<div class="ready-sum"><span>준비됨<b>' + (sm.ok || 0) + '</b></span><span>확인 권장<b>' + (sm.warn || 0) +
          '</b></span><span>꼭 고칠 것<b>' + (sm.fail || 0) + '</b></span><span>아직 확인 안 함<b>' + (sm.todo || 0) + "</b></span></div>" +
          '<div class="ready-list">' + (r.items || []).map(function (i) {
            return '<div class="ready-row ' + esc(i.status) + '"><i class="ic">' + (readyIcon[i.status] || "·") + "</i><b>" + esc(i.title) + "</b><span>" + esc(i.detail) + "</span></div>";
          }).join("") + "</div>";
      };
      var load = function (path, post) {
        return api(path, post).then(draw).catch(function () { sub.textContent = "자동 실행기에 연결하지 못했어요"; });
      };
      load("/api/readiness");
      var close = function () { back.remove(); document.removeEventListener("keydown", onKey); btnCheck.focus(); };
      var onKey = function (e) { if (e.key === "Escape") close(); };
      document.addEventListener("keydown", onKey);
      back.addEventListener("click", function (e) {
        var act = e.target.closest && e.target.closest("[data-act]");
        if (e.target === back || (act && act.getAttribute("data-act") === "close")) return close();
        if (act && act.getAttribute("data-act") === "keys") {
          keyBtn.disabled = true; keyBtn.textContent = "확인 중…";
          load("/api/live-key-check", {}).then(function () { keyBtn.disabled = false; keyBtn.textContent = "실계좌 키 확인 (조회만)"; });
        }
        if (act && act.getAttribute("data-act") === "rehearse") {
          rehBtn.disabled = true; rehBtn.textContent = "리허설 중… (1분쯤)";
          load("/api/rehearsal", {}).then(function () { rehBtn.disabled = false; rehBtn.textContent = "리허설 해보기"; });
        }
      });
    };
    btnCheck.addEventListener("click", openReadiness);

    btnRefresh.addEventListener("click", function () { start("/api/refresh"); });
    btnRun.addEventListener("click", confirmRun);
    btnPause.addEventListener("click", function () {
      var next = !btnPause.classList.contains("on");
      api("/api/pause", { paused: next }).then(function (c) {
        paint(c);
        toast(next ? "일시정지했어요. 다시 시작을 누를 때까지 주문을 내지 않아요." : "다시 시작했어요. 다음 자동 실행부터 주문을 낼 수 있어요.");
      }).catch(function () { toast("자동 실행기에 연결하지 못했어요. Mintory를 다시 열어주세요."); });
    });
    if (META.source === "sample") { btnRun.hidden = true; btnCheck.hidden = true; }  // 예시 숫자로는 매매·점검을 하지 않음
    paint(CTL);
    poll();
  }

  // 실제 기록을 보는 중이면 몇 분마다 새로 읽는다. 자동 실행이 HTML을 다시 만들면 바로 반영된다.
  if (META.source === "paper") setTimeout(reloadWhenIdle, 5 * 60 * 1000);
})();
</script>
