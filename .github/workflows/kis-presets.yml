# 한국투자증권 프리셋 전략 10종을 미국 ETF로 백테스트 (연구용).
# 이 브랜치에 스크립트를 올리면 자동 실행, 또는 Actions 탭에서 수동 실행.
name: kis-presets
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-0be16k"]
    paths: ["scripts/kis_presets.py", ".github/workflows/kis-presets.yml"]
jobs:
  presets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/kis_presets.py
      - run: cat reports/kis_presets.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the report to this branch
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p results && cp reports/kis_presets.md results/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -m "KIS presets report from run ${{ github.run_id }}" && git push
