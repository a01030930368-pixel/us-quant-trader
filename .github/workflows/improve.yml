# Actions 탭 -> improve -> Run workflow: 50/50 개선 실험 리포트를 만듭니다.
name: improve
on:
  # Also runs automatically when the experiment or strategy code changes.
  push:
    paths:
      - "scripts/improve_strategy.py"
      - "quant/strategies.py"
      - ".github/workflows/improve.yml"
  workflow_dispatch:
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/improve_strategy.py
      - run: cat reports/improve.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: improve
          path: reports/
