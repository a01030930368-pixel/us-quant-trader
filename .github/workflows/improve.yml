# Actions 탭 -> improve -> Run workflow: 50/50 개선 실험 리포트를 만듭니다.
name: improve
on:
  # 수동 실행만 (Actions 사용 시간 절약). Actions 탭 -> 이 워크플로 -> Run workflow
  workflow_dispatch:
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/improve_strategy.py
      - run: cat reports/improve.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: improve
          path: reports/
