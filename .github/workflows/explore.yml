# 새 전략 계열 탐색: 연구 브랜치에 전략 코드를 올리면 자동 실행, 또는 Actions 탭에서 수동 실행.
name: explore
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-jzo1hc"]
    paths: ["quant/new_strategies.py", "scripts/explore_new.py", ".github/workflows/explore.yml"]
jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/explore_new.py
      - run: cat reports/explore.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the report to this branch
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p results && cp reports/explore.md reports/explore_returns.csv results/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -m "Explore report from run ${{ github.run_id }}" && git push
